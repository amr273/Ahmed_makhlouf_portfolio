<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      overflow: hidden;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.9;
    }

    .auth-box {
      position: relative;
      z-index: 1;
      width: min(460px, 90vw);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
    }

    .auth-box h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      text-align: center;
    }

    .auth-box p {
      margin: 0 0 20px;
      color: #dbeafe;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-weight: 600;
      color: #e2e8f0;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.7);
      color: white;
      font-size: 1rem;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button,
    .link-btn {
      flex: 1;
      min-width: 150px;
      background: linear-gradient(135deg, #22c55e, #10b981);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .link-btn {
      background: #334155;
    }

    button:hover,
    .link-btn:hover {
      transform: translateY(-1px);
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      color: #86efac;
      font-weight: 600;
    }

    .message.error {
      color: #fca5a5;
    }

    .message.success {
      color: #86efac;
    }
  </style>
</head>

<body>
  <canvas id="stars"></canvas>

  <div class="auth-box">
    <h1>Change Password</h1>
    <p>Update your dashboard password.</p>

    <form id="changePasswordForm">
      <div>
        <label for="currentPassword">Current Password</label>
        <input id="currentPassword" type="password" placeholder="Enter current password" required>
      </div>

      <div>
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" placeholder="Enter new password" required>
      </div>

      <div>
        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" placeholder="Confirm new password" required>
      </div>

      <div class="button-row">
        <button type="submit">Save Password</button>
        <a class="link-btn" href="dashboard.html">Back to Dashboard</a>
      </div>
    </form>

    <p id="changePasswordMessage" class="message"></p>
  </div>

  <script src="js/canvas.js"></script>
  <script src="js/change-password.js"></script>
</body>

</html>
