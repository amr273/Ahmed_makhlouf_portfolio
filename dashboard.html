<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Dashboard</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Chakra Petch', sans-serif;
    }

    .dashboard-shell {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 100px auto;
      padding: 40px 20px 70px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      padding: 20px 30px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logout-btn,
    .secondary-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
    }

    .secondary-btn {
      background: #334155;
      color: white;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(300px, 450px) minmax(0, 1fr);
      gap: 26px;
    }

    .panel {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.6rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-weight: 600;
      color: #e2e8f0;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.7);
      color: white;
      font-size: 0.98rem;
      resize: vertical;
    }

    textarea {
      min-height: 110px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .primary-btn,
    .secondary-btn,
    .edit-btn,
    .delete-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .primary-btn,
    .edit-btn {
      background: linear-gradient(135deg, #22c55e, #10b981);
      color: white;
    }

    .secondary-btn {
      background: #334155;
      color: white;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
    }

    .primary-btn:hover,
    .secondary-btn:hover,
    .edit-btn:hover,
    .delete-btn:hover,
    .logout-btn:hover {
      transform: translateY(-1px);
    }

    .project-list {
      display: grid;
      gap: 18px;
    }

    .project-item {
      display: flex;
      gap: 16px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .project-item img {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 12px;
      background: #0f172a;
    }

    .project-item-content {
      flex: 1;
      min-width: 0;
    }

    .project-item-content h3 {
      margin: 0 0 8px;
      font-size: 1.3rem;
    }

    .project-item-content p {
      margin: 0 0 10px;
      line-height: 1.5;
      color: #dbeafe;
    }

    .project-links {
      margin-bottom: 10px;
    }

    .project-links a {
      color: #86efac;
      text-decoration: none;
      font-weight: 600;
    }

    .project-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 820px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .project-item {
        flex-direction: column;
      }

      .project-item img {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <canvas id="stars"></canvas>

  <div class="dashboard-shell">
    <header class="topbar">
      <h1>Dashboard</h1>
      <div class="topbar-actions">
        <button id="changePasswordBtn" class="secondary-btn" type="button">Change Password</button>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>
    </header>

    <div class="dashboard-grid">
      <section class="panel">
        <h2>Add / Edit Project</h2>

        <form id="projectForm">
          <input type="hidden" id="projectId">

          <div>
            <label for="title">Project Name</label>
            <input id="title" type="text" placeholder="Enter project name" required>
          </div>

          <div>
            <label for="image">Project Image</label>
            <input id="image" type="text" placeholder="Paste image URL or upload from your computer" required>
            <input id="imageUpload" type="file" accept="image/*">
          </div>

          <div>
            <label for="url">Project Link</label>
            <input id="url" type="url" placeholder="https://example.com" required>
          </div>

          <div>
            <label for="description">Description</label>
            <textarea id="description" placeholder="Write a short description..."></textarea>
          </div>

          <div class="button-row">
            <button id="submitBtn" class="primary-btn" type="submit">Add Project</button>
            <button id="cancelEdit" class="secondary-btn" type="button">Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Projects List</h2>
        <div id="projectList" class="project-list"></div>
      </section>
    </div>
  </div>

  <script src="js/canvas.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
