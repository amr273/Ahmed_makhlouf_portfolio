<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      overflow: hidden;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.9;
    }

    .auth-box {
      position: relative;
      z-index: 1;
      width: min(420px, 90vw);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
    }

    .auth-box h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      text-align: center;
    }

    .auth-box p {
      margin: 0 0 20px;
      color: #dbeafe;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-weight: 600;
      color: #e2e8f0;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.7);
      color: white;
      font-size: 1rem;
    }

    button {
      background: linear-gradient(135deg, #22c55e, #10b981);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      text-align: center;
      color: #86efac;
      font-weight: 600;
    }

    .message.error {
      color: #fca5a5;
    }
  </style>
</head>

<body>
  <canvas id="stars"></canvas>

  <div class="auth-box">
    <h1>Dashboard Login</h1>
    <p>Enter the password to access the projects dashboard.</p>

    <form id="loginForm">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" required>
      <button type="submit">Login</button>
    </form>

    <p id="loginMessage" class="message"></p>
  </div>

  <script src="canvas.js"></script>
  <script src="login.js"></script>
</body>

</html>
